# Theme Check configuration (added 2026-10-07, audit FIX-14)
# Run locally: shopify theme check
extends: theme-check:recommended

# US-only English store; other locales are Shopify-generated and never complete.
MatchingTranslations:
  enabled: false

# Third-party scripts (analytics, apps) can't be served from Shopify's CDN.
RemoteAsset:
  enabled: false

# Orphaned snippets are sometimes kept intentionally; warn, don't fail.
OrphanedSnippet:
  severity: warning

# Pre-existing on cobrand/brand sections at 2026-10-07; layout-shift polish, not a
# breakage. Shown as warnings so CI stays meaningful. Fix and restore to error later.
ImgWidthAndHeight:
  severity: warning

# False positive: app blocks (e.g. Yuko Order Limits) live in the app, not this repo.
JSONMissingBlock:
  enabled: false
